<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <main>

    </main>

    <body>
        <p>Online Registration Form</p>

        <form class="formBox" id="form" novalidate>
            
            <!-- Ask tutor if there is a simpler way to do this? -->
            <div class="fields username-box">
                <label for="firstName">Name</label>
                
                <div class="name-field">

                    <div class="fields">
                        <input required type="text" id="firstName" name="firstName" placeholder="First">
                        <span class="error-message" aria-live="polite"></span>
                    </div>

                    <div class="fields">
                        <input required type="text" id="lastName" name="lastName" placeholder="Last">
                        <span class="error-message" aria-live="polite"></span>
                    </div>

                </div>
        
            </div>

            <!-- <div class="fields row-grid">
                <label for="fName">Name</label>
                <input required type="text" id="fName" name="fName" >
                <span class="error-message"></span>
            </div>

            <div class="fields row-grid">
                <label for="lName"></label>
                <input required type="text" id="lName" name="lName" >
                <span class="error-message"></span>
            </div> -->

            <!-- regex format for emails [a-zA-Z0-9]+@[a-zA-Z0-9]+\.com pattern="[a-zA-Z0-9]+@[a-zA-Z0-9]+\.com" -->
            <div class="fields">
                <label for="email">Email</label>
                <input required type="email" id="email" name="email">
                <span class="error-message" aria-live="polite"></span>
            </div>

            <div class="fields">
                <label for="phone">Phone</label>
                <!-- Add validation text format due to phone number's unqiue format pattern="[0-9]{3} [0-9]{3} [0-9]{3}-->
                <input required type="text" id="phone" name="phone" placeholder="### ### ####" pattern="[0-9]{3} [0-9]{3} [0-9]{3}">
                <span class="error-message" aria-live="polite"></span>
            </div>


            <!-- make messsage box expanable + word limit -->
            <div class="fields">
                <label for="message">Message</label>
                <input type="text" id="message" name="message" maxlength="200">
                <span class="error-message" aria-live="polite"></span>
            </div>

            <button id="submitBtn" type="submit">SEND</button>
        </form>

    </body>


    <footer>

    </footer>
    <script src="script.js"> </script>
</body>
</html>
